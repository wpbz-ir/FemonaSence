<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>فمونا سنس | مدیریت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;--bg:#07111c;--panel:#0d1928;--panel2:#101f31;--line:#20354c;--text:#edf4fb;--muted:#93a8bc;--primary:#2f6ea3;--primary2:#3d84bf;--danger:#8e3b43;--success:#2e8b62;--warning:#8d6a28;--shadow:0 18px 50px rgba(0,0,0,.22)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 12% 0%,#102238 0,#07111c 38%,#050b12 100%);color:var(--text)}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--primary);color:#fff;font-weight:700;transition:.18s ease}button:hover{background:var(--primary2);transform:translateY(-1px)}button.alt{background:#1b2b3d}button.alt:hover{background:#23384e}button.danger{background:var(--danger)}button.success{background:var(--success)}button.warn{background:var(--warning)}button.small{padding:7px 10px;font-size:12px}button:disabled{opacity:.55;cursor:not-allowed;transform:none}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #29415b;background:#081420;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:#4a7da9;box-shadow:0 0 0 3px rgba(61,132,191,.12)}textarea{min-height:110px;resize:vertical}label{display:block;color:#afc0d0;font-size:12px;margin-bottom:6px}.muted{color:var(--muted)}.hint{color:#9bb0c4;font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;direction:ltr;text-align:left}.nowrap{white-space:nowrap}.right{margin-right:auto}.stack>*+*{margin-top:12px}
.layout{min-height:100vh;display:grid;grid-template-columns:286px minmax(0,1fr);grid-template-areas:"side main"}.sidebar{grid-area:side;position:sticky;top:0;height:100vh;padding:20px 16px;border-left:1px solid var(--line);background:rgba(7,15,25,.92);backdrop-filter:blur(18px);overflow:auto}.main{grid-area:main;min-width:0;padding:20px 22px 40px}.brand{font-weight:800;font-size:20px;line-height:1.4}.brand small{display:block;color:#91a6b9;font-size:12px;font-weight:500;margin-top:4px}.nav{display:grid;gap:6px;margin-top:22px}.nav button{width:100%;display:flex;align-items:center;gap:9px;justify-content:flex-start;background:transparent;color:#cfdae5;text-align:right;padding:10px 12px}.nav button:hover{background:#132335}.nav button.active{background:#17304a;color:#fff;outline:1px solid #315c7e}.sidebar-footer{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.top h1{font-size:22px;margin:0}.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-right:auto}.badge{display:inline-flex;align-items:center;justify-content:center;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#17314b;color:#cfe2f3;border:1px solid #2a4863}.badge.success{background:#123f30;border-color:#23684f;color:#96e8c5}.badge.danger{background:#451e24;border-color:#71343d;color:#ffafb9}.badge.warn{background:#493717;border-color:#785a25;color:#f2d38e}.badge.muted{background:#1c2834;border-color:#324354;color:#afc0cf}
.card{background:linear-gradient(180deg,rgba(14,27,43,.96),rgba(10,21,33,.96));border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px}.subhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{background:var(--panel2);border:1px solid #24405a;border-radius:16px;padding:14px}.stat .label{color:#9fb3c6;font-size:12px}.stat .value{font-size:23px;font-weight:800;margin-top:4px}.notice{padding:12px 14px;background:#122338;border:1px solid #294965;border-radius:14px;color:#c6d7e7;line-height:1.9}.kv{display:grid;grid-template-columns:160px minmax(0,1fr);gap:8px 14px;align-items:start}.kv div:nth-child(odd){color:#9fb3c6}.kv div:nth-child(even){word-break:break-word}.table-wrap{overflow:auto;border:1px solid #20364b;border-radius:14px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #1e3448;vertical-align:top;text-align:right}.table th{background:#102032;color:#a8bbcd;white-space:nowrap}.table tr:last-child td{border-bottom:0}.empty{padding:28px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toolbar .search{max-width:360px}.section-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}
.modal{position:fixed;inset:0;background:rgba(1,6,11,.84);display:none;align-items:center;justify-content:center;padding:20px;z-index:90}.modal.open{display:flex}.modal-box{width:min(1080px,100%);max-height:90vh;overflow:auto;background:#0a1624;border:1px solid #2b4761;border-radius:22px;padding:18px;box-shadow:0 25px 90px rgba(0,0,0,.5)}.modal-box.small{width:min(620px,100%)}.modal-head{display:flex;gap:10px;align-items:center;margin-bottom:14px}.modal-head h2{margin:0;font-size:19px}.modal-body{display:grid;gap:12px}.close{margin-right:auto;background:#1a2a3a}.pill-row{display:flex;gap:8px;flex-wrap:wrap}.mini-card{background:#0f1d2d;border:1px solid #213b54;border-radius:14px;padding:12px}.mini-card h4{margin:0 0 8px;font-size:13px;color:#c7d8e7}.toast{position:fixed;left:20px;bottom:20px;max-width:min(560px,calc(100vw - 40px));background:#0d1b2a;border:1px solid #31506f;color:#eef5fb;padding:12px 14px;border-radius:14px;display:none;z-index:120;line-height:1.8}.loading{padding:30px;text-align:center;color:#a8bed0}.danger-text{color:#ff9da9}.success-text{color:#80e0b4}.warn-text{color:#f2cf86}
@media(max-width:1050px){.layout{grid-template-columns:240px minmax(0,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section-grid{grid-template-columns:1fr}.kv{grid-template-columns:120px minmax(0,1fr)}}
@media(max-width:760px){.layout{display:block}.sidebar{position:relative;height:auto;border-left:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:12px}.grid,.grid.two,.grid.three{grid-template-columns:1fr}.top h1{font-size:19px}.kv{grid-template-columns:1fr}.modal{padding:10px}}
</style>
</head>
<body>
<div id="gate" class="modal open"><div class="modal-box small"><div class="modal-head"><div><h2>🔐 ورود به پنل مدیریت</h2><div class="hint">کلید فقط برای این مرورگر نگهداری می‌شود و تا زمان خروج دستی، دوباره درخواست نمی‌شود.</div></div></div><label for="token">کلید دسترسی پنل</label><input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_API_TOKEN"><div id="gateMsg" class="danger-text" style="margin-top:8px"></div><div class="toolbar" style="margin-top:12px"><button id="saveToken">ورود و ذخیره</button></div></div></div>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">🎬 فمونا سنس<small>مرکز مدیریت محتوا و عملیات</small></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-footer">
      <button class="alt" style="width:100%" onclick="clearToken()">خروج از پنل</button>
    </div>
  </aside>
  <main class="main">
    <div class="top"><div><h1 id="pageTitle">داشبورد</h1><div id="pageHint" class="hint">نمای کلی سامانه</div></div><div class="top-actions"><button class="alt" onclick="loadPage()">↻ تازه‌سازی</button></div></div>
    <div id="app"></div>
  </main>
</div>
<div id="userModal" class="modal" onclick="modalBackdrop(event)"><div class="modal-box"><div class="modal-head"><div><h2 id="userModalTitle">نمای ۳۶۰ درجه کاربر</h2><div id="userModalSub" class="hint"></div></div><button class="close" onclick="closeUserModal()">بستن</button></div><div id="userModalBody" class="modal-body"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const TOKEN_KEY='cv_admin_token_v2';
const NAV=[
 ['dashboard','داشبورد','🏠'],['users','کاربران','👥'],['titles','عنوان‌ها','🎬'],['series','سریال و فصل/قسمت','📺'],['taxonomy','دسته‌بندی‌ها','🏷️'],
 ['upload','اتصال نسخه و فایل','📤'],['pipelines','پردازش کیفیت','⚙️'],['jobs','وظایف رسانه','🧰'],['plans','پلن‌ها','💎'],['coupons','کدهای تخفیف','🎟️'],['payments','پرداخت‌ها','💳'],
 ['bot-menu','منوی ربات','🤖'],['audit','حسابرسی','📜'],['settings','تنظیمات سامانه','🔧'],
 ['membership','عضویت اجباری','✅'],['ads','تبلیغات','📣']
];
const STATUS={ACTIVE:'فعال',BLOCKED:'مسدود',DISABLED:'غیرفعال',DRAFT:'پیش‌نویس',PUBLISHED:'منتشرشده',ARCHIVED:'بایگانی‌شده',READY:'آماده',QUEUED:'در صف',RUNNING:'در حال اجرا',SUCCEEDED:'موفق',FAILED:'ناموفق',CANCELLED:'لغوشده',CREATED:'ایجادشده',PAID:'پرداخت‌شده',REQUESTED:'درخواست‌شده',SUCCESS:'موفق',ERROR:'خطا',PENDING:'در انتظار'};
const KIND={MOVIE:'فیلم',SERIES:'سریال',ANIMATION:'انیمیشن'};
const JOB={MEDIA_TRANSCODE:'تبدیل رسانه',TRANSCODE:'تبدیل رسانه'};
const PAGES={dashboard:'داشبورد',users:'کاربران',titles:'عنوان‌ها',series:'سریال و فصل/قسمت',taxonomy:'دسته‌بندی‌ها',upload:'اتصال نسخه و فایل',pipelines:'پردازش کیفیت',jobs:'وظایف رسانه',plans:'پلن‌ها',coupons:'کدهای تخفیف',payments:'پرداخت‌ها','bot-menu':'منوی ربات',audit:'حسابرسی',settings:'تنظیمات سامانه',membership:'عضویت اجباری',ads:'تبلیغات'};
let currentPanel=panelFromPath();
const $=id=>document.getElementById(id);
function panelFromPath(){const p=location.pathname.split('/')[2]||'dashboard';return PAGES[p]?p:'dashboard'}
function token(){return localStorage.getItem(TOKEN_KEY)||''}
function clearToken(){localStorage.removeItem(TOKEN_KEY);location.href='/admin'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function repairMojibake(value){let text=String(value??'');const score=t=>{let fa=0,bad=0,repl=0;for(const c of t){const n=c.charCodeAt(0);if(n>=0x600&&n<=0x6ff)fa++;if('ÃÂØÙÛÐÑ�'.includes(c))bad++;if(c==='�')repl++;}return fa*4-bad*3-repl*7;};let best=text,bestScore=score(text);for(let i=0;i<2;i++){for(const enc of ['latin1','windows-1252']){try{const bytes=Uint8Array.from(Array.from(text,c=>c.charCodeAt(0)&255));const repaired=new TextDecoder('utf-8',{fatal:true}).decode(bytes);const s=score(repaired);if(s>bestScore){best=repaired;bestScore=s}}catch{}}if(best===text)break;text=best}return best}
function txt(v){return repairMojibake(v==null?'':v)}
function faNum(v){if(v===null||v===undefined||v==='')return '—';const n=Number(v);if(Number.isFinite(n))return n.toLocaleString('fa-IR');return String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function faMoney(v,currency='تومان'){if(v===null||v===undefined||v==='')return '—';return `${faNum(Number(v).toLocaleString('en-US',{maximumFractionDigits:2}))} ${currency}`}
function faDate(value,withTime=true){if(!value)return 'ثبت نشده';const d=new Date(value);if(Number.isNaN(d.getTime()))return txt(value);try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit',hour:withTime?'2-digit':undefined,minute:withTime?'2-digit':undefined}).format(d)}catch{return txt(value)}}
function labelStatus(v){const key=String(v??'').toUpperCase();return STATUS[key]||txt(v)||'—'}
function badge(v){const k=String(v??'').toUpperCase();let c='';if(['ACTIVE','PUBLISHED','READY','SUCCEEDED','PAID','SUCCESS'].includes(k))c='success';else if(['BLOCKED','DISABLED','FAILED','ERROR','CANCELLED'].includes(k))c='danger';else if(['RUNNING','QUEUED','PENDING','CREATED','REQUESTED','DRAFT'].includes(k))c='warn';else c='muted';return `<span class="badge ${c}">${esc(labelStatus(v))}</span>`}
function toast(msg,bad=false){const el=$('toast');el.textContent=txt(msg);el.style.display='block';el.style.borderColor=bad?'#743742':'#31506f';clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.style.display='none',4500)}
function nav(){ $('nav').innerHTML=NAV.map(([p,t,i])=>`<button class="${currentPanel===p?'active':''}" onclick="go('${p}')"><span>${i}</span><span>${t}</span></button>`).join('') }
function go(panel){if(!PAGES[panel])panel='dashboard';currentPanel=panel;const path=panel==='dashboard'?'/admin':'/admin/'+panel;history.pushState({panel},'',path);loadPage()}
window.addEventListener('popstate',()=>{currentPanel=panelFromPath();loadPage()});
async function api(path,opt={}){const headers=Object.assign({'Accept':'application/json'},opt.headers||{});const k=token();if(k)headers.Authorization='Bearer '+k;if(opt.body&&typeof opt.body!=='string'){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch('/api/admin'+path,Object.assign({},opt,{headers,cache:'no-store'}));let data=null;try{data=await r.json()}catch{}if(r.status===401||r.status===403){localStorage.removeItem(TOKEN_KEY);$('gate').classList.add('open');throw new Error('کلید دسترسی معتبر نیست یا دسترسی کافی نیست.')}if(!r.ok)throw new Error(data?.detail||data?.message||`HTTP ${r.status}`);return data}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">موردی برای نمایش نیست.</td></tr>`}</tbody></table></div>`}
function btn(text,handler,cls=''){return `<button class="small ${cls}" onclick="${handler}">${esc(text)}</button>`}
function stat(label,value,cls=''){return `<div class="stat"><div class="label">${esc(label)}</div><div class="value ${cls}">${esc(faNum(value))}</div></div>`}
function busy(){return '<div class="card loading">در حال دریافت اطلاعات…</div>'}
async function loadPage(){nav();$('pageTitle').textContent=PAGES[currentPanel];$('pageHint').textContent=currentPanel==='dashboard'?'نمای کلی سامانه و وضعیت سرویس‌ها':'مدیریت حرفه‌ای '+PAGES[currentPanel];$('app').innerHTML=busy();try{await pages[currentPanel]()}catch(e){$('app').innerHTML=`<div class="card"><div class="danger-text">خطا در بارگذاری: ${esc(e.message)}</div><div class="hint" style="margin-top:8px">پس از رفع مشکل اتصال، دوباره تلاش کنید.</div></div>`}}
function userName(u){return txt([u.first_name,u.last_name].filter(Boolean).join(' '))||txt(u.username)||'بدون نام'}
const pages={
 dashboard:async()=>{const d=await api('/dashboard');const services=d.services||[];$('app').innerHTML=`<div class="grid">${stat('کاربران',d.users)}${stat('عنوان‌ها',d.titles)}${stat('نسخه‌های محتوا',d.releases)}${stat('فایل‌های ذخیره‌سازی',d.storage_files)}</div><div class="grid two" style="margin-top:12px"><div class="card"><div class="subhead"><h3>وضعیت وظایف رسانه</h3><span class="right muted">نمای لحظه‌ای</span></div>${renderStats(d.jobs)}</div><div class="card"><div class="subhead"><h3>وضعیت پردازش کیفیت</h3><span class="right muted">نمای لحظه‌ای</span></div>${renderStats(d.pipelines)}</div></div><div class="card" style="margin-top:12px"><h3>سرویس‌ها و آخرین فعالیت</h3>${table(['سرویس','وضعیت','آخرین فعالیت','نمونه اجرا'],services.map(x=>`<tr><td>${esc(txt(x.service))}</td><td>${badge(x.status)}</td><td>${esc(faDate(x.last_seen_at))}</td><td class="mono">${esc(txt(x.instance||'—'))}</td></tr>`))}</div>`},
 users:async()=>{const rows=await api('/users?limit=50');$('app').innerHTML=`<div class="card"><div class="toolbar"><h2 style="margin:0">👥 کاربران</h2><button class="right alt small" onclick="pages.users()">↻ تازه‌سازی</button><span class="muted">${faNum(rows.length)} کاربر اخیر</span></div>${table(['شناسه','کاربر','وضعیت','آخرین فعالیت','عملیات'],rows.map(u=>`<tr><td><div>${esc(faNum(u.telegram_user_id))}</div><div class="muted mono">${esc(u.id)}</div></td><td><b>${esc(userName(u))}</b><div class="muted">@${esc(txt(u.username||'بدون نام کاربری'))}</div></td><td>${badge(u.status)}</td><td>${esc(faDate(u.last_seen_at))}</td><td class="row">${btn('نمای ۳۶۰°',`openUser360('${u.id}')`)}${String(u.status).toUpperCase()==='ACTIVE'?btn('مسدود','setUserStatus(\''+u.id+'\',\'BLOCKED\')','danger'):btn('فعال','setUserStatus(\''+u.id+'\',\'ACTIVE\')','success')}</td></tr>`))}</div>`},
 titles:async()=>{const rows=await api('/titles?limit=50');$('app').innerHTML=`<div class="card"><div class="toolbar"><h2 style="margin:0">🎬 عنوان‌ها</h2><button class="right" onclick="showTitleForm()">+ عنوان جدید</button></div><div id="titleForm"></div>${table(['عنوان','نوع','سال','IMDb','وضعیت','عملیات'],rows.map(t=>`<tr><td><b>${esc(txt(t.title_fa))}</b><div class="muted">${esc(txt(t.title_en||''))}</div></td><td>${esc(KIND[t.kind]||txt(t.kind))}</td><td>${esc(faNum(t.year))}</td><td>${esc(t.imdb==null?'—':faNum(t.imdb))}</td><td>${badge(t.status)}</td><td>${btn('ویرایش',`editTitle('${t.id}')`)}</td></tr>`))}</div>`},
 series:async()=>{const titles=await api('/titles?limit=100');const series=titles.filter(x=>x.kind==='SERIES');$('app').innerHTML=`<div class="grid two"><div class="card"><h2>📺 ساختار سریال</h2><label>سریال</label><select id="seriesId" onchange="loadSeriesTree()"><option value="">انتخاب سریال</option>${series.map(x=>`<option value="${x.id}">${esc(txt(x.title_fa))}</option>`).join('')}</select><div id="seriesTree" style="margin-top:12px"></div></div><div class="card"><h2>افزودن فصل</h2><label>شماره فصل</label><input id="seasonNo" type="number" min="1"><label style="margin-top:8px">عنوان فصل</label><input id="seasonTitle"><label style="margin-top:8px">توضیحات</label><textarea id="seasonSynopsis"></textarea><button style="margin-top:10px" onclick="createSeason()">ثبت فصل</button><h3 style="margin-top:20px">افزودن قسمت</h3><label>فصل</label><input id="episodeSeasonId" class="mono" placeholder="از درخت سریال انتخاب کنید"><label style="margin-top:8px">شماره قسمت</label><input id="episodeNo" type="number" min="1"><label style="margin-top:8px">عنوان قسمت</label><input id="episodeTitle"><label style="margin-top:8px">توضیحات</label><textarea id="episodeSynopsis"></textarea><button style="margin-top:10px" onclick="createEpisode()">ثبت قسمت</button></div></div>`},

ctive?btn('غیرفعال',`toggleMembershipChannel('${x.id}',false)`,'danger'):btn('فعال',`toggleMembershipChannel('${x.id}',true)`,'success')}${btn('حذف',`delMembershipChannel('${x.id}')`,'danger')}</td></tr>`))}</div>`},
 ads:async()=>{const [s,r]=await Promise.all([api('/ads/settings'),api('/ads/requests?limit=50')]);$('app').innerHTML=`<div class="grid two"><div class="card"><h2>📣 تنظیمات تبلیغات</h2><label>شناسه کانال تبلیغات</label><input id="adChatId" value="${esc(s.channel_chat_id??'')}" placeholder="‎-1001234567890‎"><label style="margin-top:8px">نام کاربری کانال</label><input id="adUsername" value="${esc(s.channel_username||'')}" placeholder="mychannel (بدون @)"><label style="margin-top:8px">تعرفه‌ها</label><textarea id="adRates">${esc(s.rates_text||'')}</textarea><label style="margin-top:8px">راهنمای ارسال</label><textarea id="adInstructions">${esc(s.instructions_text||'')}</textarea><label style="margin-top:8px">اطلاعات تماس</label><input id="adContact" value="${esc(s.contact_text||'')}"><div class="grid two" style="margin-top:8px"><div><label>انتشار خودکار پس از تأیید</label><select id="adAuto"><option value="true" ${s.auto_channel_publish?'selected':''}>بله</option><option value="false" ${!s.auto_channel_publish?'selected':''}>خیر</option></select></div><div><label>بخش تبلیغات</label><select id="adActive"><option value="true" ${s.active?'selected':''}>فعال</option><option value="false" ${!s.active?'selected':''}>غیرفعال</option></select></div></div><button style="margin-top:10px" onclick="saveAdSettings()">ذخیره تنظیمات</button></div><div class="card"><h2>📬 درخواست‌های تبلیغ</h2><div class="kv"><div>در انتظار</div><div>${esc(faNum((r.counts||{}).pending||0))}</div><div>تأییدشده</div><div>${esc(faNum((r.counts||{}).approved||0))}</div><div>منتشرشده</div><div>${esc(faNum((r.counts||{}).published||0))}</div><div>ردشده</div><div>${esc(faNum((r.counts||{}).rejected||0))}</div></div>${table(['کاربر','نوع','متن','وضعیت','زمان','عملیات'],(r.items||[]).map(x=>`<tr><td><b>${esc(txt((x.user||{}).first_name||''))}</b><div class="muted">@${esc(txt((x.user||{}).username||'—'))}</div></td><td>${esc(txt(x.content_type))}${x.has_file?' 📎':''}</td><td class="muted">${esc(txt((x.content_text||'').slice(0,60)))}</td><td>${badge(x.status==='APPROVED'?'ACTIVE':x.status==='REJECTED'?'DISABLED':x.status)}</td><td>${esc(faDate(x.created_at,false))}</td><td class="row">${x.status==='PENDING'?btn('تأیید',`setAdStatus('${x.id}','APPROVED')`,'success')+btn('رد',`setAdStatus('${x.id}','REJECTED')`,'danger'):(x.status==='APPROVED'?btn('انتشار',`setAdStatus('${x.id}','PUBLISHED')`):'')}</td></tr>`))}<div class="hint" style="margin-top:10px">تأیید/انتشار از چت ربات هم برای ادمین‌ها با دکمه‌های همان پیام امکان‌پذیر است.</div></div></div>`}

function renderStats(v){if(!v)return '<div class="muted">داده‌ای ثبت نشده است.</div>';const walk=(obj)=>Object.entries(obj).map(([k,val])=>{if(val&&typeof val==='object'&&!Array.isArray(val))return `<div class="mini-card"><h4>${esc(txt(k))}</h4>${walk(val)}</div>`;return `<div class="kv"><div>${esc(txt(k))}</div><div>${esc(faNum(val))}</div></div>`}).join('');return walk(v)}
function showTitleForm(){ $('titleForm').innerHTML=`<div class="card" style="margin-top:12px"><div class="grid two"><div><label>نوع</label><select id="tKind"><option value="MOVIE">فیلم</option><option value="SERIES">سریال</option><option value="ANIMATION">انیمیشن</option></select><label style="margin-top:8px">نام فارسی</label><input id="tFa"><label style="margin-top:8px">نام لاتین</label><input id="tEn"><label style="margin-top:8px">نام اصلی</label><input id="tOrig"><label style="margin-top:8px">سال</label><input id="tYear" type="number"><label style="margin-top:8px">شناسه IMDb</label><input id="tImdbId"></div><div><label>امتیاز IMDb</label><input id="tRating" type="number" step="0.1"><label style="margin-top:8px">تعداد رأی IMDb</label><input id="tVotes" type="number"><label style="margin-top:8px">نشانی پوستر</label><input id="tPoster"><label style="margin-top:8px">نشانی پس‌زمینه</label><input id="tBackdrop"><label style="margin-top:8px">حقوق تأیید شده</label><select id="tRights"><option value="false">خیر</option><option value="true">بله</option></select><label style="margin-top:8px">مرجع حقوق</label><input id="tRightsRef"></div></div><label style="margin-top:8px">خلاصه</label><textarea id="tSynopsis"></textarea><label style="margin-top:8px">وضعیت</label><select id="tStatus"><option value="DRAFT">پیش‌نویس</option><option value="PUBLISHED">منتشرشده</option><option value="ARCHIVED">بایگانی‌شده</option></select><button style="margin-top:10px" onclick="createTitle()">ثبت عنوان</button></div>`}
async function createTitle(){const body={kind:$('tKind').value,title_fa:$('tFa').value,title_en:$('tEn').value||null,original_title:$('tOrig').value||null,synopsis:$('tSynopsis').value||null,release_year:$('tYear').value?Number($('tYear').value):null,imdb_id:$('tImdbId').value||null,imdb_rating:$('tRating').value?Number($('tRating').value):null,imdb_votes:$('tVotes').value?Number($('tVotes').value):null,poster_url:$('tPoster').value||null,backdrop_url:$('tBackdrop').value||null,rights_verified:$('tRights').value==='true',rights_reference:$('tRightsRef').value||null,status:$('tStatus').value};await api('/titles',{method:'POST',body});toast('عنوان ثبت شد');go('titles')}
async function editTitle(id){const x=await api('/titles/'+id);$('app').innerHTML=`<div class="card"><div class="toolbar"><h2 style="margin:0">ویرایش عنوان</h2><button class="right alt" onclick="go('titles')">بازگشت</button></div><div class="grid two"><div><label>وضعیت</label><select id="eStatus"><option value="DRAFT" ${x.status==='DRAFT'?'selected':''}>پیش‌نویس</option><option value="PUBLISHED" ${x.status==='PUBLISHED'?'selected':''}>منتشرشده</option><option value="ARCHIVED" ${x.status==='ARCHIVED'?'selected':''}>بایگانی‌شده</option></select><label style="margin-top:8px">حقوق تأیید شده</label><select id="eRights"><option value="false" ${!x.rights_verified?'selected':''}>خیر</option><option value="true" ${x.rights_verified?'selected':''}>بله</option></select><label style="margin-top:8px">مرجع حقوق</label><input id="eRef" value="${esc(x.rights_reference||'')}"></div><div><label>نشانی پوستر</label><input id="ePoster" value="${esc(x.poster_url||'')}"><label style="margin-top:8px">نشانی پس‌زمینه</label><input id="eBackdrop" value="${esc(x.backdrop_url||'')}"><label style="margin-top:8px">تریلر</label><input id="eTrailer" value="${esc(x.trailer_url||'')}"></div></div><label style="margin-top:8px">خلاصه</label><textarea id="eSynopsis">${esc(x.synopsis||'')}</textarea><button style="margin-top:10px" onclick="updateTitle('${id}')">ذخیره تغییرات</button></div><div class="card" style="margin-top:12px"><h3>نسخه‌های متصل</h3>${table(['کیفیت','زبان','زیرنویس','وضعیت','حجم'],(x.releases||[]).map(r=>`<tr><td>${esc(txt(r.quality))}</td><td>${esc(txt(r.language))}</td><td>${esc(txt(r.subtitle_type))}</td><td>${badge(r.status)}</td><td>${r.size_bytes?esc(faNum(r.size_bytes))+' بایت':'—'}</td></tr>`))}</div>`}
async function updateTitle(id){await api('/titles/'+id,{method:'PATCH',body:{status:$('eStatus').value,rights_verified:$('eRights').value==='true',rights_reference:$('eRef').value||null,poster_url:$('ePoster').value||null,backdrop_url:$('eBackdrop').value||null,trailer_url:$('eTrailer').value||null,synopsis:$('eSynopsis').value||null}});toast('عنوان به‌روزرسانی شد');editTitle(id)}
async function loadSeriesTree(){const id=$('seriesId').value;if(!id){$('seriesTree').innerHTML='';return}const tree=await api('/titles/'+id+'/seasons');$('seriesTree').innerHTML=tree.map(s=>`<div class="mini-card"><div class="subhead"><b>فصل ${esc(faNum(s.season_number))}${s.title?' · '+esc(txt(s.title)):''}</b><button class="right small alt" onclick="selectSeason('${s.id}')">انتخاب فصل</button></div><div class="muted" style="margin-top:8px">${(s.episodes||[]).map(e=>`قسمت ${esc(faNum(e.episode_number))}${e.title?' · '+esc(txt(e.title)):''}`).join('<br>')||'قسمتی ثبت نشده است.'}</div></div>`).join('')||'<div class="empty">فصلی ثبت نشده است.</div>'}

async function attachUpload(){const storage=$('storageId').value,target=$('targetTitle').value;if(!storage||!target){toast('فایل و هدف را انتخاب کنید',true);return}let body={storage_file_id:storage,quality:$('upQuality').value.trim(),language:$('upLang').value.trim(),subtitle_type:$('upSub').value.trim(),label:$('upLabel').value.trim()||null,status:$('upStatus').value};if(target.startsWith('movie:'))body.title_id=target.split(':')[1];else{body.episode_id=$('episodeId')?.value;if(!body.episode_id){toast('برای سریال باید قسمت انتخاب شود',true);return}}const r=await api('/upload/attach',{method:'POST',body});toast('نسخه ثبت و فایل متصل شد: '+r.release_id);go('upload')}

async function togglePlan(id,active){await api('/plans/'+id,{method:'PATCH',body:{active}});toast(active?'پلن فعال شد':'پلن غیرفعال شد');go('plans')}
function couponScopeChanged(){const v=$('cpScope').value;$('cpPlanBox').style.display=v==='PLAN'?'block':'none';$('cpUsersBox').style.display=v==='USERS'?'block':'none'}
async function createCoupon(){const ids=($('cpUsers').value||'').split(/[,\s\n]+/).map(x=>x.trim()).filter(Boolean).map(Number).filter(Number.isFinite);const body={code:$('cpCode').value.trim()||null,name_fa:$('cpName').value.trim(),description:$('cpDesc').value.trim()||null,discount_type:$('cpType').value,value:Number($('cpValue').value),max_uses:$('cpMax').value?Number($('cpMax').value):null,per_user_limit:Number($('cpPerUser').value||1),valid_from:$('cpFrom').value?new Date($('cpFrom').value).toISOString():null,valid_until:$('cpUntil').value?new Date($('cpUntil').value).toISOString():null,active:true,scope_type:$('cpScope').value,scope_plan_id:$('cpScope').value==='PLAN'?$('cpPlan').value||null:null,telegram_user_ids:ids};await api('/coupons',{method:'POST',body});toast('کد تخفیف ساخته شد');go('coupons')}
async function updateCoupon(id,active){await api('/coupons/'+id,{method:'PATCH',body:{active}});toast(active?'کد تخفیف فعال شد':'کد تخفیف غیرفعال شد');go('coupons')}
async function setUserStatus(id,status){await api('/users/'+id+'/status',{method:'PATCH',body:{status}});toast('وضعیت کاربر تغییر کرد');if(currentPanel==='users')await pages.users();}
function showUserModal(title,sub,html){$('userModalTitle').textContent=title;$('userModalSub').textContent=sub||'';$('userModalBody').innerHTML=html;$('userModal').classList.add('open')}
function closeUserModal(){$('userModal').classList.remove('open')}
function modalBackdrop(e){if(e.target.id==='userModal')closeUserModal()}
async function openUser360(id){showUserModal('نمای ۳۶۰ درجه کاربر','در حال دریافت اطلاعات…','<div class="loading">در حال دریافت اطلاعات…</div>');try{const x=await api('/users/'+id+'/360');const u=x.user||{};$('userModalTitle').textContent='نمای ۳۶۰ درجه کاربر';$('userModalSub').textContent=txt(u.username?('@'+u.username):('شناسه تلگرام '+faNum(u.telegram_user_id)));$('userModalBody').innerHTML=`<div class="toolbar">${badge(u.status)}<span class="muted">ایجاد: ${esc(faDate(u.created_at))}</span><span class="muted">آخرین فعالیت: ${esc(faDate(u.last_seen_at))}</span><button class="right success" onclick="setUserStatus('${id}','ACTIVE');closeUserModal()">فعال</button><button class="danger" onclick="setUserStatus('${id}','BLOCKED');closeUserModal()">مسدود</button><button class="danger" onclick="setUserStatus('${id}','DISABLED');closeUserModal()">غیرفعال</button></div><div class="grid three"><div class="mini-card"><h4>هویت</h4><div>${esc(userName(u))}</div><div class="muted">${esc(u.language_code||'زبان ثبت نشده')}</div></div><div class="mini-card"><h4>کیف پول</h4><div>${esc(faMoney(x.wallet_balance_irr/10,'تومان'))}</div><div class="muted">موجودی ریالی: ${esc(faMoney(x.wallet_balance_irr,'ریال'))}</div></div><div class="mini-card"><h4>تعامل</h4><div>علاقه‌مندی‌ها: ${esc(faNum(x.favorites_count))}</div><div>تاریخچه: ${esc(faNum(x.watch_history_count))}</div></div></div><div class="grid two"><div class="mini-card"><h4>نقش‌ها</h4><div class="pill-row">${(x.roles||[]).map(r=>`<span class="badge">${esc(txt(r))}</span>`).join('')||'<span class="muted">نقشی ثبت نشده است.</span>'}</div></div><div class="mini-card"><h4>اشتراک‌ها</h4>${(x.subscriptions||[]).map(s=>`<div style="padding:8px 0;border-bottom:1px solid #21384f"><b>${esc(txt(s.plan||s.code))}</b> · ${badge(s.status)}<div class="muted">از ${esc(faDate(s.starts_at,false))} تا ${esc(faDate(s.expires_at,false))}</div></div>`).join('')||'<div class="muted">اشتراکی ثبت نشده است.</div>'}</div></div><div class="mini-card"><h4>سفارش‌ها</h4>${table(['شماره','پلن','مبلغ','وضعیت','زمان'],(x.orders||[]).map(o=>`<tr><td class="mono">${esc(o.order_number)}</td><td>${esc(txt(o.plan||'—'))}</td><td>${esc(faMoney(o.amount_toman))}</td><td>${badge(o.status)}</td><td>${esc(faDate(o.created_at))}</td></tr>`))}</div>`}catch(e){$('userModalBody').innerHTML=`<div class="danger-text">${esc(e.message)}</div>`}}
async function repairEncoding(){const r=await api('/repair-encoding',{method:'POST'});toast(`پاکسازی انجام شد؛ ${faNum(r.changed_fields)} مقدار اصلاح شد`);}
async function toggleMembershipGate(enabled){await api('/membership/config',{method:'PUT',body:{enabled}});toast(enabled?'دروازه عضویت فعال شد':'دروازه عضویت غیرفعال شد');go('membership')}
async function addMembershipChannel(){const t=$('mChTarget').value.trim();if(!t){toast('شناسه یا @username کانال را وارد کنید',true);return}await api('/membership/channels',{method:'POST',body:{target:t,title:$('mChTitle').value.trim()||null,invite_url:$('mChInvite').value.trim()||null,required:$('mChRequired').value==='true',active:$('mChActive').value==='true'}});toast('کانال ثبت شد');go('membership')}
async function toggleMembershipChannel(id,active){await api('/membership/channels/'+id,{method:'PATCH',body:{active}});toast('وضعیت کانال تغییر کرد');go('membership')}
async function delMembershipChannel(id){await api('/membership/channels/'+id,{method:'DELETE'});toast('کانال حذف شد');go('membership')}
async function saveAdSettings(){const cid=$('adChatId').value.trim();await api('/ads/settings',{method:'PUT',body:{channel_chat_id:cid?Number(cid):null,channel_username:$('adUsername').value.trim()||null,rates_text:$('adRates').value.trim()||null,instructions_text:$('adInstructions').value.trim()||null,contact_text:$('adContact').value.trim()||null,auto_channel_publish:$('adAuto').value==='true',active:$('adActive').value==='true'}});toast('تنظیمات تبلیغات ذخیره شد');go('ads')}
async function setAdStatus(id,status){await api('/ads/requests/'+id+'/status',{method:'POST',body:{status}});toast('وضعیت درخواست تغییر کرد');go('ads')}
async function saveToken(){const v=$('token').value.trim();if(!v){$('gateMsg').textContent='کلید دسترسی را وارد کنید.';return}try{localStorage.setItem(TOKEN_KEY,v);await api('/settings');$('gate').classList.remove('open');$('gateMsg').textContent='';await loadPage()}catch(e){localStorage.removeItem(TOKEN_KEY);$('gateMsg').textContent=e.message}}
$('saveToken').onclick=saveToken;$('token').addEventListener('keydown',e=>{if(e.key==='Enter')saveToken()});
async function boot(){nav();if(!token()){$('gate').classList.add('open');return}try{$('gate').classList.remove('open');await loadPage()}catch(e){$('gate').classList.add('open');$('gateMsg').textContent=e.message}}
window.addEventListener('unhandledrejection',e=>{if(e&&e.reason)toast(e.reason.message||String(e.reason),true)});boot();
</script>
</body>
</html>
