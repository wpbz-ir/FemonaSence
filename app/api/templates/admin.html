<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>فمونا سنس | مدیریت</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#08111d;color:#e9f0f7}
a{color:inherit;text-decoration:none}.wrap{max-width:1450px;margin:auto;padding:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-size:20px;font-weight:900}.hint{color:#8fa4b8;font-size:13px}
.nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;background:#0d1928;padding:8px;border:1px solid #213247;border-radius:18px;position:sticky;top:8px;z-index:5}
.nav a{padding:9px 8px;border-radius:12px;text-align:center;font-size:13px;background:#122135}.nav a.active{outline:2px solid #5079a1;background:#19304a}
.card{background:#0d1928;border:1px solid #213247;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 14px 42px rgba(0,0,0,.18)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:14px;border-radius:16px;background:#111f31;border:1px solid #223b56}.stat b{display:block;font-size:24px;margin-top:4px}.muted{color:#91a5b8}.ok{color:#65d391}.bad{color:#ff8a8a}.warn{color:#ffd27d}
label{display:block;font-size:12px;color:#a9bbcb;margin-bottom:6px}input,select,textarea{width:100%;padding:10px 11px;border-radius:11px;border:1px solid #2a4058;background:#08131f;color:#eef5fb;outline:none}textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;background:#295a85;color:#fff;font-weight:700}button.alt{background:#1c2c40}button.danger{background:#7c3035}button.small{padding:7px 9px;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.right{margin-right:auto}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid #213247;vertical-align:top;text-align:right}.table th{color:#9eb3c7;position:sticky;top:0;background:#0d1928}
.notice{padding:12px 14px;border-radius:14px;background:#122238;border:1px solid #294662;color:#bfd2e4;font-size:13px;line-height:1.8}.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:18px;bottom:18px;max-width:min(520px,calc(100vw - 36px));padding:12px 14px;border-radius:14px;background:#0e1b2a;border:1px solid #31506f;display:none;z-index:20}.overlay{position:fixed;inset:0;background:rgba(2,7,13,.86);display:flex;align-items:center;justify-content:center;z-index:30}.overlay .box{width:min(520px,calc(100vw - 30px));background:#0d1928;border:1px solid #29415a;border-radius:20px;padding:20px}
@media(max-width:1050px){.nav{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.two{grid-template-columns:1fr}.wrap{padding:10px}}
</style>
</head>
<body>
<div id="gate" class="overlay"><div class="box"><h2 style="margin-top:0">🔐 ورود به پنل مدیریت</h2><p class="muted">کلید دسترسی فقط در همین نشست مرورگر نگهداری می‌شود. ابتدا اتصال را با سرور تأیید کنید.</p><label for="token">ADMIN_API_TOKEN</label><input id="token" type="password" autocomplete="off" placeholder="کلید دسترسی پنل"><div class="row" style="margin-top:10px"><button id="saveToken">اتصال و ذخیره کلید</button></div><div id="gateMsg" class="bad" style="margin-top:10px"></div></div></div>
<div class="wrap">
  <div class="top"><div><div class="brand">🎬 فمونا سنس · پنل مدیریت</div><div class="hint" id="pageHint">کنترل محتوا، کاربران، رسانه و عملیات</div></div><div class="row"><button class="alt" onclick="clearToken()">خروج از پنل</button><button onclick="location.reload()">↻ تازه‌سازی</button></div></div>
  <nav class="nav" id="nav"></nav>
  <main id="app"></main>
</div>
<div id="toast" class="toast"></div>
<script>
const KEY='fs_admin_key';
const NAV=[
 ['dashboard','داشبورد','🏠'],['users','کاربران','👥'],['titles','عنوان‌ها','🎬'],['series','سریال','📺'],['taxonomy','دسته‌بندی','🏷️'],
 ['upload','آپلود/نسخه','📤'],['pipelines','پایپ‌لاین','⚙️'],['jobs','Jobها','🧰'],['plans','پلن‌ها','💎'],['payments','پرداخت','💳'],['bot-menu','منوی ربات','🤖'],['audit','لاگ حسابرسی','📜'],['settings','تنظیمات','🔧']
];
const page=(location.pathname.split('/')[2]||'dashboard');
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function key(){return sessionStorage.getItem(KEY)||''}
function toast(msg,bad=false){const el=$('toast');el.textContent=msg;el.style.display='block';el.style.borderColor=bad?'#7d3a3f':'#31506f';clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.style.display='none',4200)}
function clearToken(){sessionStorage.removeItem(KEY);location.reload()}
async function api(path,opt={}){
 const h=Object.assign({'Accept':'application/json'},opt.headers||{}); const k=key(); if(k)h.Authorization='Bearer '+k;
 if(opt.body && typeof opt.body!=='string'){h['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}
 const r=await fetch('/api/admin'+path,Object.assign({},opt,{headers:h,cache:'no-store'}));
 let data=null; try{data=await r.json()}catch{}
 if(r.status===401){sessionStorage.removeItem(KEY);location.reload();throw new Error('کلید دسترسی معتبر نیست.')} 
 if(!r.ok) throw new Error(data?.detail||data?.message||('HTTP '+r.status));
 return data;
}
async function saveToken(){const v=$('token').value.trim(); if(!v){$('gateMsg').textContent='کلید دسترسی را وارد کنید.';return} try{sessionStorage.setItem(KEY,v);await api('/dashboard');$('gate').style.display='none';loadPage();}catch(e){sessionStorage.removeItem(KEY);$('gateMsg').textContent=e.message}}
$('saveToken').onclick=saveToken;$('token').addEventListener('keydown',e=>{if(e.key==='Enter')saveToken()});
function nav(){ $('nav').innerHTML=NAV.map(([p,t,i])=>`<a class="${page===p?'active':''}" href="/admin/${p}">${i} ${t}</a>`).join(''); }
function btn(text,onclick,cls=''){return `<button class="small ${cls}" onclick="${onclick}">${esc(text)}</button>`}
function stat(label,value,cls=''){return `<div class="stat"><div class="muted">${esc(label)}</div><b class="${cls}">${esc(value)}</b></div>`}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="muted">موردی برای نمایش نیست.</td></tr>`}</tbody></table></div>`}
async function loadPage(){nav();const names={dashboard:'داشبورد',users:'کاربران',titles:'عنوان‌ها',series:'مدیریت سریال',taxonomy:'ژانر/بازیگر/مجموعه',upload:'آپلود و اتصال نسخه',pipelines:'پایپ‌لاین تبدیل کیفیت',jobs:'مدیریت Jobها',plans:'پلن‌ها',payments:'پرداخت‌ها', 'bot-menu':'منوی ربات',audit:'حسابرسی',settings:'تنظیمات امن'};$('pageHint').textContent=names[page]||'پنل مدیریت';try{await pages[page]()}catch(e){$('app').innerHTML=`<div class="card"><div class="bad">خطا: ${esc(e.message)}</div></div>`;}}

const pages={
 dashboard:async()=>{const d=await api('/dashboard');$('app').innerHTML=`<div class="grid">${stat('کاربران',d.users)}${stat('عنوان‌ها',d.titles)}${stat('Releaseها',d.releases)}${stat('Storage Fileها',d.storage_files)}</div><div class="grid two"><div class="card"><h3>وضعیت Job</h3><pre class="code">${esc(JSON.stringify(d.jobs,null,2))}</pre></div><div class="card"><h3>وضعیت Pipeline</h3><pre class="code">${esc(JSON.stringify(d.pipelines,null,2))}</pre></div></div><div class="card"><h3>Heartbeats</h3>${table(['سرویس','وضعیت','آخرین‌بار'],(d.heartbeats||[]).map(x=>`<tr><td>${esc(x.service)}</td><td>${esc(x.status)}</td><td>${esc(x.last_seen_at)}</td></tr>`))}</div>`},
 users:async()=>{const rows=await api('/users?limit=100');$('app').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">👥 کاربران</h2><button class="right" onclick="pages.users()">↻</button></div>${table(['شناسه/تلگرام','نام کاربری','نام','وضعیت','آخرین فعالیت','عملیات'],rows.map(u=>`<tr><td><div>${esc(u.id)}</div><div class="muted">${esc(u.telegram_user_id)}</div></td><td>${esc(u.username||'')}</td><td>${esc(u.name||'')}</td><td>${esc(u.status)}</td><td>${esc(u.last_seen_at||'')}</td><td class="row">${btn('360°',`openUser360('${u.id}')`)}${u.status==='ACTIVE'?btn('مسدود','setUserStatus(\'${u.id}\',\'BLOCKED\')','danger'):btn('فعال','setUserStatus(\'${u.id}\',\'ACTIVE\')')}</td></tr>`))}</div>`},
 titles:async()=>{const rows=await api('/titles?limit=100');$('app').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">🎬 عنوان‌ها</h2><button class="right" onclick="showTitleForm()">+ عنوان جدید</button></div><div id="titleForm"></div>${table(['عنوان','نوع','سال','IMDb','وضعیت','عملیات'],rows.map(t=>`<tr><td>${esc(t.title_fa)}<div class="muted">${esc(t.title_en||'')}</div></td><td>${esc(t.kind)}</td><td>${esc(t.year||'')}</td><td>${esc(t.imdb||'')}</td><td>${esc(t.status)}</td><td>${btn('ویرایش','editTitle(\''+t.id+'\')')}</td></tr>`))}</div>`},
 series:async()=>{const titles=await api('/titles?limit=100');const series=titles.filter(x=>x.kind==='SERIES');$('app').innerHTML=`<div class="card"><h2>📺 ساختار سریال</h2><label>سریال</label><select id="seriesId" onchange="loadSeriesTree()"><option value="">انتخاب کنید</option>${series.map(x=>`<option value="${x.id}">${esc(x.title_fa)}</option>`).join('')}</select><div id="seriesTree" class="card" style="margin-top:12px"></div></div><div class="grid two"><div class="card"><h3>افزودن فصل</h3><label>شماره فصل</label><input id="seasonNo" type="number" min="1"><label>عنوان</label><input id="seasonTitle"><label>توضیحات</label><textarea id="seasonSynopsis"></textarea><button onclick="createSeason()">ثبت فصل</button></div><div class="card"><h3>افزودن قسمت</h3><label>شناسه فصل</label><input id="episodeSeasonId"><label>شماره قسمت</label><input id="episodeNo" type="number" min="1"><label>عنوان</label><input id="episodeTitle"><label>توضیحات</label><textarea id="episodeSynopsis"></textarea><button onclick="createEpisode()">ثبت قسمت</button></div></div>`},
 taxonomy:async()=>{const [g,p,c]=await Promise.all([api('/genres'),api('/people'),api('/collections')]);$('app').innerHTML=`<div class="grid three"><div class="card"><h3>ژانر جدید</h3><label>فارسی</label><input id="gfa"><label>English</label><input id="gen"><button onclick="createGenre()">ثبت</button></div><div class="card"><h3>بازیگر/شخص جدید</h3><label>فارسی</label><input id="pfa"><label>English</label><input id="pen"><button onclick="createPerson()">ثبت</button></div><div class="card"><h3>مجموعه جدید</h3><label>نام</label><input id="cfa"><label>نام انگلیسی</label><input id="cen"><label>والد (اختیاری)</label><select id="cparent"><option value="">بدون والد</option>${c.map(x=>`<option value="${x.id}">${esc(x.fa)}</option>`).join('')}</select><button onclick="createCollection()">ثبت</button></div></div><div class="grid two"><div class="card"><h3>ژانرها</h3>${table(['فارسی','انگلیسی','slug'],g.map(x=>`<tr><td>${esc(x.fa)}</td><td>${esc(x.en)}</td><td>${esc(x.slug)}</td></tr>`))}</div><div class="card"><h3>افراد</h3>${table(['فارسی','انگلیسی','slug'],p.map(x=>`<tr><td>${esc(x.fa||'')}</td><td>${esc(x.en)}</td><td>${esc(x.slug)}</td></tr>`))}</div></div><div class="card"><h3>مجموعه‌ها</h3>${table(['نام','English','والد','slug'],c.map(x=>`<tr><td>${esc(x.fa)}</td><td>${esc(x.en||'')}</td><td>${esc(x.parent_id||'—')}</td><td>${esc(x.slug)}</td></tr>`))}</div>`},
 upload:async()=>{const [titles,storage]=await Promise.all([api('/titles?limit=100'),api('/storage/files?unattached=true&limit=100')]);const movies=titles.filter(x=>x.kind!=='SERIES');const series=titles.filter(x=>x.kind==='SERIES');$('app').innerHTML=`<div class="card notice"><b>روش ورود فایل حجیم:</b> فایل ویدئو را در کانال Storage تلگرام بفرستید؛ ربات آن را خودکار به Storage File تبدیل می‌کند. این صفحه برای فایل محلی/Browser Upload نیست؛ در اینجا فایل ثبت‌شده را به Movie یا Episode متصل و نسخه را READY/منتشر می‌کنیم.</div><div class="card"><h3>ثبت نسخه و اتصال فایل</h3><div class="grid two"><div><label>Storage File</label><select id="storageId"><option value="">انتخاب فایل</option>${storage.map(x=>`<option value="${x.id}">${esc(x.filename||x.id)} · ${esc(x.status)}</option>`).join('')}</select><label>هدف</label><select id="targetTitle" onchange="targetChanged()"><option value="">انتخاب فیلم/سریال</option>${movies.map(x=>`<option value="movie:${x.id}">🎬 ${esc(x.title_fa)}</option>`).join('')}${series.map(x=>`<option value="series:${x.id}">📺 ${esc(x.title_fa)}</option>`).join('')}</select><div id="episodeTarget"></div></div><div><label>کیفیت</label><input id="upQuality" value="1080p"><label>زبان</label><input id="upLang" value="ORIGINAL"><label>زیرنویس</label><input id="upSub" value="NONE"><label>برچسب</label><input id="upLabel" placeholder="مثلاً WEB-DL 1080p"><label>وضعیت</label><select id="upStatus"><option>READY</option><option>DRAFT</option><option>PUBLISHED</option><option>DISABLED</option></select></div></div><div class="row" style="margin-top:12px"><button onclick="attachUpload()">ثبت و اتصال</button><span class="muted">برای PUBLISHED، سیستم ابتدا READY می‌سازد، فایل را متصل می‌کند و سپس مجوز حقوق را بررسی می‌کند.</span></div></div>`},
 pipelines:async()=>{const [titles,runs]=await Promise.all([api('/titles?limit=100'),api('/pipelines?limit=50')]);$('app').innerHTML=`<div class="card"><h3>ساخت Quality Matrix</h3><div class="grid two"><div><label>عنوان</label><select id="pipeTitle" onchange="loadPipeReleases()"><option value="">انتخاب</option>${titles.map(x=>`<option value="${x.id}">${esc(x.title_fa)}</option>`).join('')}</select><label>Source Release</label><select id="pipeRelease"></select></div><div><label>کیفیت‌ها (مثلاً 480,720,1080)</label><input id="pipeQ" value="480,720,1080"><label>نیاز به اشتراک</label><select id="pipeSub"><option value="false">خیر</option><option value="true">بله</option></select><label>حداقل Rank</label><input id="pipeRank" type="number" value="0"><label>Priority</label><input id="pipePriority" type="number" value="50"></div></div><button onclick="createPipeline()">ساخت Pipeline</button></div><div class="card"><h3>اجراهای اخیر</h3>${table(['ID','عنوان','وضعیت','کیفیت‌ها','زمان'],runs.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.title_id)}</td><td>${esc(r.status)}</td><td>${esc((r.requested_qualities||[]).join(', '))}</td><td>${esc(r.created_at)}</td></tr>`))}</div>`},
 jobs:async()=>{const rows=await api('/jobs?limit=100');$('app').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">🧰 Jobها</h2><button class="right" onclick="pages.jobs()">↻</button></div>${table(['Job','نوع','وضعیت','پیشرفت','اولویت','تلاش','عملیات'],rows.map(j=>`<tr><td>${esc(j.id)}</td><td>${esc(j.job_type)}</td><td>${esc(j.status)}</td><td>${esc(j.progress)}%</td><td>${esc(j.priority)}</td><td>${esc(j.attempts)}/${esc(j.max_attempts)}</td><td class="row">${btn('جزئیات',`jobDetail('${j.id}')`)}${btn('Retry',`retryJob('${j.id}')`)}${btn('لغو',`cancelJob('${j.id}')`,'danger')}<input style="width:90px" id="prio_${j.id}" value="${esc(j.priority)}"><button class="small" onclick="priorityJob('${j.id}')">اولویت</button></td></tr>`))}</div>`},
 plans:async()=>{const rows=await api('/plans');$('app').innerHTML=`<div class="grid two"><div class="card"><h3>پلن جدید</h3><label>code</label><input id="plCode"><label>نام فارسی</label><input id="plFa"><label>نام انگلیسی</label><input id="plEn"><label>قیمت تومان</label><input id="plToman" value="0"><label>قیمت ریال</label><input id="plIrr" value="0"><label>مدت (روز)</label><input id="plDays" type="number" value="30"><label>Rank</label><input id="plRank" type="number" value="0"><button onclick="createPlan()">ثبت پلن</button></div><div class="card"><h3>پلن‌های فعلی</h3>${table(['code','نام','تومان','روز','rank','active'],rows.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name_fa)}</td><td>${esc(x.price_toman)}</td><td>${esc(x.duration_days)}</td><td>${esc(x.rank)}</td><td>${esc(x.active)}</td></tr>`))}</div></div>`},
 payments:async()=>{const [rows,g]=await Promise.all([api('/payments?limit=100'),api('/payment-gateway')]);$('app').innerHTML=`<div class="grid two"><div class="card"><h3>درگاه</h3><pre class="code">${esc(JSON.stringify(g,null,2))}</pre></div><div class="card"><h3>پرداخت‌های اخیر</h3>${table(['order','plan','provider','attempt','payment','amount','ref'],rows.map(x=>`<tr><td>${esc(x.order_number)}</td><td>${esc(x.plan||'')}</td><td>${esc(x.provider||'')}</td><td>${esc(x.attempt_status||'')}</td><td>${esc(x.payment_status||'')}</td><td>${esc(x.amount_toman)}</td><td>${esc(x.provider_reference||'')}</td></tr>`))}</div></div>`},
 'bot-menu':async()=>{const d=await api('/bot-menu');$('app').innerHTML=`<div class="card"><h3>🤖 منوی ربات</h3>${table(['متن','Callback'],d.buttons.map(x=>`<tr><td>${esc(x.text)}</td><td class="code">${esc(x.callback_data)}</td></tr>`))}<div class="notice" style="margin-top:12px">دکمه‌ها در چیدمان استاندارد دو ستونه رندر می‌شوند. فهرست‌های طولانی ژانر/بازیگر/مجموعه در ربات صفحه‌بندی شده‌اند.</div></div>`},
 audit:async()=>{const rows=await api('/audit?limit=200');$('app').innerHTML=`<div class="card"><h3>📜 لاگ حسابرسی</h3>${table(['زمان','عملیات','نوع','شناسه','متد/مسیر','موفق','IP'],rows.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.action)}</td><td>${esc(x.entity_type)}</td><td>${esc(x.entity_id||'')}</td><td class="code">${esc(x.method||'')} ${esc(x.path||'')}</td><td>${x.success?'✅':'❌'}</td><td>${esc(x.ip_address||'')}</td></tr>`))}</div>`},
 settings:async()=>{const d=await api('/settings');$('app').innerHTML=`<div class="card"><h3>🔧 تنظیمات قابل مشاهده</h3><div class="notice">Secretها، توکن ربات، Merchant ID واقعی و سایر مقادیر حساس از API پنل برگردانده نمی‌شوند. تغییرات محیطی را در فایل <span class="code">.env</span> انجام دهید.</div><pre class="code" style="margin-top:12px">${esc(JSON.stringify(d,null,2))}</pre></div>`}
};

function showTitleForm(){document.getElementById('titleForm').innerHTML=`<div class="card" style="margin:12px 0"><div class="grid two"><div><label>نوع</label><select id="tKind"><option>MOVIE</option><option>SERIES</option><option>ANIMATION</option></select><label>نام فارسی</label><input id="tFa"><label>نام انگلیسی</label><input id="tEn"><label>نام اصلی</label><input id="tOrig"><label>سال</label><input id="tYear" type="number"><label>IMDb ID</label><input id="tImdbId"></div><div><label>امتیاز IMDb</label><input id="tRating" type="number" step="0.1"><label>IMDb Votes</label><input id="tVotes" type="number"><label>Poster URL</label><input id="tPoster"><label>Backdrop URL</label><input id="tBackdrop"><label>حقوق تأیید شده</label><select id="tRights"><option value="false">خیر</option><option value="true">بله</option></select><label>Reference حقوق</label><input id="tRightsRef"><label>وضعیت</label><select id="tStatus"><option>DRAFT</option><option>PUBLISHED</option><option>ARCHIVED</option></select></div></div><label>خلاصه</label><textarea id="tSynopsis"></textarea><button onclick="createTitle()">ثبت عنوان</button></div>`}
async function createTitle(){const body={kind:$('tKind').value,title_fa:$('tFa').value,title_en:$('tEn').value||null,original_title:$('tOrig').value||null,synopsis:$('tSynopsis').value||null,release_year:$('tYear').value?Number($('tYear').value):null,imdb_id:$('tImdbId').value||null,imdb_rating:$('tRating').value?Number($('tRating').value):null,imdb_votes:$('tVotes').value?Number($('tVotes').value):null,poster_url:$('tPoster').value||null,backdrop_url:$('tBackdrop').value||null,rights_verified:$('tRights').value==='true',rights_reference:$('tRightsRef').value||null,status:$('tStatus').value};await api('/titles',{method:'POST',body});toast('عنوان ثبت شد');pages.titles()}
async function editTitle(id){const x=await api('/titles/'+id);$('app').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">ویرایش عنوان</h2><button class="right" onclick="pages.titles()">🔙 بازگشت</button></div><pre class="code">${esc(JSON.stringify(x,null,2))}</pre><div class="grid two"><div><label>وضعیت</label><select id="eStatus"><option ${x.status==='DRAFT'?'selected':''}>DRAFT</option><option ${x.status==='PUBLISHED'?'selected':''}>PUBLISHED</option><option ${x.status==='ARCHIVED'?'selected':''}>ARCHIVED</option></select><label>حقوق تأیید شده</label><select id="eRights"><option value="false" ${!x.rights_verified?'selected':''}>خیر</option><option value="true" ${x.rights_verified?'selected':''}>بله</option></select></div><div><label>Reference حقوق</label><input id="eRef" value="${esc(x.rights_reference||'')}"><label>Poster URL</label><input id="ePoster" value="${esc(x.poster_url||'')}"><label>Backdrop URL</label><input id="eBackdrop" value="${esc(x.backdrop_url||'')}"></div></div><label>خلاصه</label><textarea id="eSynopsis">${esc(x.synopsis||'')}</textarea><button onclick="updateTitle('${id}')">ذخیره</button></div><div class="card"><h3>Releaseهای عنوان</h3>${table(['ID','کیفیت','زبان','وضعیت','حجم'],(x.releases||[]).map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.quality)}</td><td>${esc(r.language)}</td><td>${esc(r.status)}</td><td>${esc(r.size_bytes||'')}</td></tr>`))}</div>`}
async function updateTitle(id){await api('/titles/'+id,{method:'PATCH',body:{status:$('eStatus').value,rights_verified:$('eRights').value==='true',rights_reference:$('eRef').value||null,poster_url:$('ePoster').value||null,backdrop_url:$('eBackdrop').value||null,synopsis:$('eSynopsis').value||null}});toast('عنوان به‌روزرسانی شد');editTitle(id)}
async function targetChanged(){const v=$('targetTitle').value;const box=$('episodeTarget');if(!v||!v.startsWith('series:')){box.innerHTML='';return}const id=v.split(':')[1];const tree=await api('/titles/'+id+'/seasons');box.innerHTML='<label>قسمت</label><select id="episodeId"><option value="">انتخاب قسمت</option>'+tree.flatMap(s=>(s.episodes||[]).map(e=>`<option value="${e.id}">S${s.season_number} E${e.episode_number} · ${esc(e.title||'')}</option>`)).join('')+'</select>'}
async function attachUpload(){const storage=$('storageId').value,target=$('targetTitle').value;if(!storage||!target){toast('Storage و هدف را انتخاب کنید.',true);return;}let body={storage_file_id:storage,quality:$('upQuality').value.trim(),language:$('upLang').value.trim(),subtitle_type:$('upSub').value.trim(),label:$('upLabel').value.trim()||null,status:$('upStatus').value};if(target.startsWith('movie:'))body.title_id=target.split(':')[1];else{body.episode_id=$('episodeId')?.value;if(!body.episode_id){toast('برای سریال باید قسمت را انتخاب کنید.',true);return;}}const r=await api('/upload/attach',{method:'POST',body});toast('نسخه ثبت و فایل متصل شد: '+r.release_id);pages.upload()}
async function loadSeriesTree(){const id=$('seriesId').value;if(!id){$('seriesTree').innerHTML='';return}const tree=await api('/titles/'+id+'/seasons');$('seriesTree').innerHTML=tree.map(s=>`<div style="padding:10px;border:1px solid #223b56;border-radius:12px;margin:8px 0"><b>فصل ${esc(s.season_number)}${s.title?' · '+esc(s.title):''}</b><div class="muted" style="margin-top:6px">${(s.episodes||[]).map(e=>`S${esc(s.season_number)}E${esc(e.episode_number)} · ${esc(e.title||'')} · <span class="code">${esc(e.id)}</span>`).join('<br>')||'قسمتی ثبت نشده است.'}</div><div style="margin-top:6px">${btn('انتخاب فصل برای فرم','selectSeason(\''+s.id+'\')')}</div></div>`).join('')||'<span class="muted">فصلی ثبت نشده است.</span>'}
function selectSeason(id){$('episodeSeasonId').value=id;toast('شناسه فصل در فرم قسمت قرار گرفت.')}
async function createSeason(){const id=$('seriesId').value;if(!id){toast('سریال را انتخاب کنید.',true);return;}await api('/titles/'+id+'/seasons',{method:'POST',body:{season_number:Number($('seasonNo').value),title:$('seasonTitle').value||null,synopsis:$('seasonSynopsis').value||null}});toast('فصل ثبت شد');loadSeriesTree()}
async function createEpisode(){const id=$('episodeSeasonId').value;if(!id){toast('شناسه فصل را وارد کنید.',true);return;}await api('/seasons/'+id+'/episodes',{method:'POST',body:{episode_number:Number($('episodeNo').value),title:$('episodeTitle').value||null,synopsis:$('episodeSynopsis').value||null}});toast('قسمت ثبت شد');loadSeriesTree()}
async function createGenre(){await api('/genres',{method:'POST',body:{name_fa:$('gfa').value,name_en:$('gen').value}});toast('ژانر ثبت شد');pages.taxonomy()}
async function createPerson(){await api('/people',{method:'POST',body:{name_fa:$('pfa').value||null,name_en:$('pen').value}});toast('شخص ثبت شد');pages.taxonomy()}
async function createCollection(){await api('/collections',{method:'POST',body:{name_fa:$('cfa').value,name_en:$('cen').value||null,parent_id:$('cparent').value||null}});toast('مجموعه ثبت شد');pages.taxonomy()}
async function loadPipeReleases(){const id=$('pipeTitle').value;if(!id){$('pipeRelease').innerHTML='';return}const rows=await api('/releases?title_id='+encodeURIComponent(id));$('pipeRelease').innerHTML=rows.map(r=>`<option value="${r.id}">${esc(r.quality)} · ${esc(r.status)} · ${esc(r.id)}</option>`).join('')}
async function createPipeline(){const id=$('pipeTitle').value;const source=$('pipeRelease').value;if(!id||!source){toast('عنوان و Source Release را انتخاب کنید.',true);return;}const r=await api('/titles/'+id+'/pipeline',{method:'POST',body:{source_release_id:source,qualities:$('pipeQ').value.split(',').map(x=>x.trim()).filter(Boolean),requires_subscription:$('pipeSub').value==='true',minimum_plan_rank:Number($('pipeRank').value||0),priority:Number($('pipePriority').value||50)}});toast('Pipeline ثبت شد: '+r.run_id);pages.pipelines()}
async function jobDetail(id){const x=await api('/jobs/'+id);toast(JSON.stringify(x,null,2));}
async function retryJob(id){await api('/jobs/'+id+'/retry',{method:'POST'});toast('Job برای retry ثبت شد');pages.jobs()}
async function cancelJob(id){await api('/jobs/'+id+'/cancel',{method:'POST'});toast('درخواست لغو ثبت شد');pages.jobs()}
async function priorityJob(id){const v=Number(document.getElementById('prio_'+id).value);await api('/jobs/'+id+'/priority',{method:'PATCH',body:{priority:v}});toast('اولویت تغییر کرد');pages.jobs()}
async function createPlan(){await api('/plans',{method:'POST',body:{code:$('plCode').value,name_fa:$('plFa').value,name_en:$('plEn').value||null,price_toman:$('plToman').value||'0',price_irr:$('plIrr').value||'0',duration_days:Number($('plDays').value),rank:Number($('plRank').value||0),active:true,sort_order:0,features:{}}});toast('پلن ثبت شد');pages.plans()}
async function openUser360(id){const x=await api('/users/'+id+'/360');$('app').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">360° کاربر</h2><button class="right" onclick="pages.users()">🔙 کاربران</button></div><pre class="code">${esc(JSON.stringify(x,null,2))}</pre><div class="row"><button onclick="setUserStatus('${id}','ACTIVE')">فعال</button><button class="danger" onclick="setUserStatus('${id}','BLOCKED')">مسدود</button><button class="danger" onclick="setUserStatus('${id}','DISABLED')">غیرفعال</button></div></div>`}
async function setUserStatus(id,status){await api('/users/'+id+'/status',{method:'PATCH',body:{status}});toast('وضعیت کاربر تغییر کرد');pages.users()}
async function boot(){if(!key()){$('gate').style.display='flex';return}try{await api('/dashboard');$('gate').style.display='none';await loadPage()}catch(e){sessionStorage.removeItem(KEY);$('gate').style.display='flex';$('gateMsg').textContent=e.message}}boot();
window.addEventListener('unhandledrejection',e=>{if(e&&e.reason)toast(e.reason.message||String(e.reason),true)});
</script>
</body>
</html>
