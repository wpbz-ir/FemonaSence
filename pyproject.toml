[project]
name = "cinema-vault"
version = "0.1.0"
description = "فمونا سنس Telegram media platform - production core"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiogram==3.31.0",
  "alembic==1.20.0",
  "aiohttp>=3.12,<4",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "httpx>=0.28,<1",
  "psycopg[binary]==3.3.6",
  "python-dotenv==1.2.3",
  "redis==8.0.0",
  "SQLAlchemy==2.0.54",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.13,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
